name: build

# 默认只在 Actions 页面手动点 "Run workflow" 时跑；push 也会触发，按需删掉 push 那段即可
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与已验证组合对齐：固定 vcpkg 与 CommonLibSSE-NG 提交，避免依赖漂移
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  CLIB_COMMIT: 7c27a75da3eb0db080c1f1f63f6df1b7cd733c2a
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

jobs:
  windows:
    # 必须用 2022：2025/latest 已换成 VS 18，CMake 不认识 "Visual Studio 17 2022"
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 拉取 Dear ImGui（1.91.8，插件用单参 PushFont，1.92 会编译失败）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "extern\deps-src" | Out-Null
          git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui extern/deps-src/imgui
          if ($LASTEXITCODE -ne 0) { throw "imgui clone 失败" }

      - name: 拉取 CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --recursive https://github.com/alandtse/CommonLibSSE-NG extern/CommonLibSSE-NG
          if ($LASTEXITCODE -ne 0) { throw "CommonLibSSE-NG clone 失败" }
          git -C extern/CommonLibSSE-NG checkout $env:CLIB_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "checkout $env:CLIB_COMMIT 失败" }
          Write-Host "CommonLibSSE-NG @ $env:CLIB_COMMIT"

      - name: Cache vcpkg 二进制缓存
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-cache-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-cache-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Cache vcpkg 已装依赖
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-inst-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-inst-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: 准备 vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone 失败" }
          git -C "$env:VCPKG_ROOT" checkout $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout 失败" }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap 失败" }
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      - name: 安装依赖（manifest 模式）
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows-static-md --x-install-root="$env:GITHUB_WORKSPACE/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install 失败" }

      - name: Configure
        id: configure
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $common = @(
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md",
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed",
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>DLL",
            "-DSUITE_ROOT=$($env:GITHUB_WORKSPACE -replace '\\','/')"
          )
          $generators = @("Visual Studio 17 2022")
          $help = (cmake --help) -join "`n"
          $generators += [regex]::Matches($help, 'Visual Studio [0-9]+ [0-9]{4}') | ForEach-Object { $_.Value }
          $ok = $false
          foreach ($g in $generators) {
            Write-Host "尝试生成器: $g"
            cmake -S . -B build -G $g -A x64 @common 2>&1 | Tee-Object -FilePath logs/configure.txt
            if ($LASTEXITCODE -eq 0) { Write-Host "生成成功: $g"; $ok = $true; break }
            Remove-Item -LiteralPath build -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) {
            Select-String -Path logs/configure.txt -Pattern 'error|CMake Error' | Select-Object -First 40 |
              ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Build
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /p:CL_MPCount=4 /nologo /v:minimal 2>&1 | Tee-Object -FilePath logs/build.txt
          $code = $LASTEXITCODE
          Select-String -Path logs/build.txt -Pattern ': (fatal )?error ' | Select-Object -First 40 |
            ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
          if ($code -ne 0) { exit 1 }

      - name: 汇总失败原因
        if: steps.configure.outcome != 'success' || steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Get-ChildItem logs -ErrorAction SilentlyContinue | ForEach-Object { "---- $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          exit 1

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: warn

      - name: 上传 DLL 与语言文件
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TamrielBestiary-zh_CN
          path: dist/Data/
          if-no-files-found: error
